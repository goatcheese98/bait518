name: Wage explorer quality
on:
  pull_request:
    paths: ['wages-viz-app/**', 'package.json', '.node-version', 'wrangler.jsonc', '.github/workflows/wages-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: wages-viz-app/package-lock.json
      - run: npm run cloud:build
      - run: npm --prefix wages-viz-app run test:lint-contract
      - run: npm --prefix wages-viz-app audit --include=dev --include=optional
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: wages-viz-app
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wages-browser-evidence
          path: |
            wages-viz-app/playwright-report
            wages-viz-app/test-results
            wages-viz-app/docs/design/screens
          retention-days: 7
