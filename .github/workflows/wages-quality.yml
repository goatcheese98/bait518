name: Wage explorer quality
on:
  pull_request:
    paths: ['wages-viz-app/**', 'package.json', '.github/workflows/wages-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wages-viz-app/package-lock.json
      - run: npm run install:locked
      - run: npx eslint src/lib/wages.ts src/components/__tests__/wages.spec.ts
        working-directory: wages-viz-app
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build
